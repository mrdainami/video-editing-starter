<!doctype html>
<html data-composition-variables='[
  {"id":"mode","type":"string","label":"close (video -> solid) or open (solid -> video)","default":"close"},
  {"id":"text","type":"string","label":"Ring text riding the edge","default":"the vibe style"},
  {"id":"cx","type":"number","label":"Face centre x","default":960},
  {"id":"cy","type":"number","label":"Face centre y","default":360},
  {"id":"bg","type":"color","label":"Colour","default":"#f4f1ea"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <!-- vibe · iris · TRANSITION. Camera-iris on the face: cream closes in from the edges with a ring of words riding the edge, shrinking to a point (close), or the reverse (open). Length 0.85s (close) / 0.7s (open). -->
      <style>/*VIBE_CSS*/</style>
      <style>
        #root { position: absolute; inset: 0; }
        .vir-mask { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 1; }
        .vir-ring { position: absolute; width: 680px; height: 680px; z-index: 2; }
        .vir-ring text { font: 800 54px "VibeTight"; letter-spacing: -0.02em; fill: var(--vibe-ink); }
        .vir-ring .acc { fill: var(--vibe-coral); }
      </style>
      <div id="root" data-composition-id="vibe-iris" data-width="1920" data-height="1080">
        <svg class="vir-mask" viewBox="0 0 1920 1080"><defs><mask id="vir-m"><rect width="1920" height="1080" fill="#fff" /><circle class="vir-hole" cx="960" cy="360" r="1500" fill="#000" /></mask></defs><rect class="vir-fill" width="1920" height="1080" mask="url(#vir-m)" /></svg>
        <svg class="vir-ring" viewBox="0 0 680 680"><defs><path id="vir-p" d="M340,340 m-290,0 a290,290 0 1,1 580,0 a290,290 0 1,1 -580,0" /></defs><g class="r"><text><textPath href="#vir-p" class="vir-tp"></textPath></text></g></svg>
        <audio id="vir-sfx" src="assets/vibe/sfx/ring-iris-shutter.wav" data-start="0" data-duration="1.4" data-volume="0.8"></audio>
      </div>
      <script>
        (() => {
          const v = window.__hyperframes.getVariables();
          const host = document.querySelector('[data-composition-id="vibe-iris"]');
          const root = host.querySelector('[data-hf-inner-root]') || host.querySelector('#root') || host; // inner root, so added elements inherit the pack's styles
          const $ = (s) => root.querySelector(s);
          $(".vir-fill").setAttribute("fill", v.bg); $(".vir-hole").setAttribute("cx", v.cx); $(".vir-hole").setAttribute("cy", v.cy);
          const ring = $(".vir-ring"); ring.style.left = v.cx - 340 + "px"; ring.style.top = v.cy - 340 + "px";
          const tp = $(".vir-tp");
          for (let i = 0; i < 3; i++) { tp.append(v.text + " "); const s = document.createElementNS("http://www.w3.org/2000/svg", "tspan"); s.setAttribute("class", "acc"); s.textContent = "✦"; tp.append(s); tp.append(" "); }
          const r = $(".r"), hole = $(".vir-hole");
          const tl = gsap.timeline({ paused: true });
          tl.set(r, { svgOrigin: "340 340", rotation: 150 }, 0);
          if (v.mode === "open") {
            tl.set(hole, { attr: { r: 0 } }, 0).set(ring, { scale: 0, opacity: 1 }, 0)
              .to(hole, { attr: { r: 1500 }, duration: 0.6, ease: "power3.out" }, 0.05)
              .to(ring, { scale: 5.2, duration: 0.6, ease: "power3.out" }, 0.05)
              .to(r, { rotation: 480, svgOrigin: "340 340", duration: 0.6, ease: "power1.out" }, 0.05)
              .to(ring, { opacity: 0, duration: 0.2 }, 0.45);
          } else {
            tl.set(ring, { scale: 1, opacity: 1 }, 0)
              .to(r, { rotation: 330, svgOrigin: "340 340", duration: 0.85, ease: "power1.in" }, 0)
              .fromTo(hole, { attr: { r: 1500 } }, { attr: { r: 300 }, duration: 0.35, ease: "power3.in" }, 0)
              .to(hole, { attr: { r: 0 }, duration: 0.45, ease: "power3.in" }, 0.35)
              .to(ring, { scale: 0, duration: 0.45, ease: "power3.in" }, 0.35)
              .set(ring, { opacity: 0 }, 0.8);
          }
          window.__timelines["vibe-iris"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

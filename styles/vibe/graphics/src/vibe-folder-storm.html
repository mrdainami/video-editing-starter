<!doctype html>
<html data-composition-variables='[
  {"id":"bg","type":"color","label":"Background it lands on","default":"#f2f2f0"},
  {"id":"count","type":"number","label":"Number of folders","default":26}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <!-- vibe · folder-storm · TRANSITION IN (takeover). Folders rush in from both sides, the background bursts from the centre. Ends fully covered. Length 1.3s. -->
      <style>/*VIBE_CSS*/</style>
      <style>
        #root { position: absolute; inset: 0; }
        .vfs-bg { position: absolute; inset: 0; clip-path: circle(0% at 50% 50%); z-index: 1; }
        .vfs-storm { position: absolute; inset: 0; z-index: 2; }
      </style>
      <div id="root" data-composition-id="vibe-folder-storm" data-width="1920" data-height="1080">
        <div class="vfs-bg"></div><div class="vfs-storm"></div>
        <audio id="vfs-sfx" src="assets/vibe/sfx/storm-flutter.wav" data-start="0.03" data-duration="1.4" data-volume="0.8"></audio>
      </div>
      <script>
        (() => {
          const v = window.__hyperframes.getVariables();
          const host = document.querySelector('[data-composition-id="vibe-folder-storm"]');
          const root = host.querySelector('[data-hf-inner-root]') || host.querySelector('#root') || host; // inner root, so added elements inherit the pack's styles
          root.querySelector(".vfs-bg").style.background = v.bg;
          const storm = root.querySelector(".vfs-storm");
          for (let i = 0; i < v.count; i++) {
            const d = document.createElement("div"); d.className = "v-folder";
            const side = i % 2 ? 1 : -1, k = Math.floor(i / 2);
            d.dataset.sx = side * (1150 + (k % 4) * 120); d.dataset.sy = -420 + (k * 71) % 840;
            d.dataset.ex = ((k % 5) - 2) * 70 + side * 40; d.dataset.ey = ((k % 3) - 1) * 60; d.dataset.r = side * (10 + (k % 4) * 6);
            d.style.left = "885px"; d.style.top = "484px"; storm.appendChild(d);
          }
          const tl = gsap.timeline({ paused: true });
          storm.querySelectorAll(".v-folder").forEach((f, i) => {
            const sx = +f.dataset.sx, sy = +f.dataset.sy, ex = +f.dataset.ex, ey = +f.dataset.ey, r = +f.dataset.r;
            tl.fromTo(f, { x: sx, y: sy, rotate: r * 2, scale: 1.3, opacity: 1 }, { x: ex, y: ey, rotate: r * 0.3, scale: 0.9, duration: 0.55, ease: "power2.inOut" }, 0.05 + (i % 13) * 0.025)
              .to(f, { x: ex * 9 + (i % 2 ? 300 : -300), y: ey * 9 + ((i % 3) - 1) * 300, rotate: -r * 3, scale: 0.5, opacity: 0, duration: 0.5, ease: "power3.in" }, 0.8 + (i % 6) * 0.02);
          });
          tl.fromTo(root.querySelector(".vfs-bg"), { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.5, ease: "power3.inOut" }, 0.65);
          window.__timelines["vibe-folder-storm"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

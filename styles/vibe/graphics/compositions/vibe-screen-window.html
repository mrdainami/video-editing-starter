<!doctype html>
<html data-composition-variables='[
  {"id":"title","type":"string","label":"Window title","default":"agent · research"},
  {"id":"mediaStart","type":"number","label":"Start point inside assets/screen.mp4 (s)","default":0},
  {"id":"hlX","type":"number","label":"Highlight x (px in frame)","default":149},
  {"id":"hlY","type":"number","label":"Highlight y","default":166},
  {"id":"hlW","type":"number","label":"Highlight width","default":482},
  {"id":"hlH","type":"number","label":"Highlight height","default":814},
  {"id":"tag","type":"string","label":"Highlight label","default":"the agent does the research"},
  {"id":"pip","type":"boolean","label":"Show presenter bubble (needs assets/talk.mp4)","default":true},
  {"id":"pipMediaStart","type":"number","label":"Presenter clip start (s) = this graphic start time","default":0},
  {"id":"enter","type":"string","label":"wipe (paper slides up over the video) or instant (paper already there, e.g. after a block-wipe reveal)","default":"wipe"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <!-- vibe · screen-window · TAKEOVER (screen recording). Window flies in on paper, coral box highlights a FULL area (measure it from the recording first), presenter bubble bottom-right. Needs assets/screen.mp4 (1920x1080). Length 6.3s. -->
      <style>
/* vibe style pack: shared tokens, fonts and type collage. Fonts are SIL Open Font License (Google Fonts). */
@font-face { font-family: "VibeSerif"; src: url("assets/vibe/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; }
@font-face { font-family: "VibePixel"; src: url("assets/vibe/fonts/silkscreen-700.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "VibeHeavy"; src: url("assets/vibe/fonts/archivo-black.woff2") format("woff2"); }
@font-face { font-family: "VibeTight"; src: url("assets/vibe/fonts/inter-tight-var.woff2") format("woff2"); font-weight: 100 900; }
:root { --vibe-coral: #fc6467; --vibe-coral-deep: #d8403f; --vibe-coral-tint: #ffd6d4; --vibe-paper: #f2f2f0; --vibe-cream: #f4f1ea; --vibe-ink: #111111; }
.v-heavy { font-family: "VibeHeavy"; letter-spacing: -0.03em; }
.v-serif { font-family: "VibeSerif"; font-style: italic; font-size: 1.12em; }
.v-tight { font-family: "VibeTight"; font-weight: 800; letter-spacing: -0.04em; }
.v-pixel { font-family: "VibePixel"; font-weight: 700; font-size: 0.82em; }
.v-sel { position: relative; padding: 0 10px; display: inline-block; z-index: 0; }
.v-sel .v-box { position: absolute; inset: 6px -2px 2px -2px; border-radius: 6px; z-index: -1; transform-origin: left; background: var(--vibe-coral-tint); }
.v-sel .v-h { position: absolute; width: 4px; height: 118%; top: -4%; background: var(--vibe-coral); }
.v-sel .v-h::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; left: -8px; background: var(--vibe-coral); }
.v-sel .v-h.l { left: -4px; } .v-sel .v-h.l::after { top: -12px; }
.v-sel .v-h.r { right: -4px; } .v-sel .v-h.r::after { bottom: -12px; }
.v-cursor { display: inline-block; width: 7px; height: 0.9em; vertical-align: -0.08em; margin-left: 8px; background: currentColor; }
.v-folder { position: absolute; width: 150px; height: 112px; border-radius: 11px; background: linear-gradient(180deg, #ff8a8c 0%, #fc6467 100%); box-shadow: 0 10px 24px rgba(120,30,30,.22); }
.v-folder::before { content: ""; position: absolute; top: -15px; left: 0; width: 40%; height: 26px; border-radius: 9px 9px 0 0; background: #e85457; z-index: -1; }
.v-badge { position: absolute; top: -16px; right: -16px; width: 54px; height: 54px; border-radius: 50%; background: var(--vibe-ink); color: #fff; font: 700 24px "VibeTight"; display: grid; place-items: center; }
/* font swap: one cell, one baseline, one width. Sizes measured so each variant matches Inter Tight 800. */
.v-swap { display: inline-grid; grid-template-rows: 1.05em; align-items: baseline; justify-items: center; }
.v-swap > span { grid-area: 1 / 1; }
.v-swap > .s1 { font-size: 0.84em; } .v-swap > .s2 { font-size: 0.51em; } .v-swap > .s3 { font-size: 1.34em; } .v-swap > .final { font-size: 1em; }
</style>
      <style>
        #root { position: absolute; inset: 0; }
        .vsw-bg { position: absolute; inset: 0; background: var(--vibe-paper); }
        .vsw-win { position: absolute; left: 150px; top: 120px; width: 1440px; height: 860px; border-radius: 22px; background: #1d1d1f; overflow: hidden; box-shadow: 0 40px 90px rgba(0,0,0,.35); transform-origin: 50% 100%; }
        .vsw-bar { height: 50px; background: #2a2a2c; display: flex; align-items: center; gap: 12px; padding-left: 20px; }
        .vsw-bar i { width: 16px; height: 16px; border-radius: 50%; background: #555; } .vsw-bar i:first-child { background: var(--vibe-coral); }
        .vsw-bar span { margin-left: 18px; font: 600 20px "VibeTight"; color: #aaa; }
        .vsw-win video { position: absolute; left: 0; top: 50px; width: 1440px; height: 810px; object-fit: cover; }
        .vsw-hl { position: absolute; border: 5px solid var(--vibe-coral); border-radius: 14px; background: rgba(252,100,103,.12); }
        .vsw-tag { position: absolute; left: calc(100% + 18px); top: 70px; background: var(--vibe-coral); color: #fff; font: 700 26px "VibeTight"; padding: 10px 18px; border-radius: 10px; white-space: nowrap; }
        .vsw-pip { position: absolute; left: 1580px; top: 720px; width: 280px; height: 280px; border-radius: 50%; overflow: hidden; border: 8px solid var(--vibe-paper); box-shadow: 0 16px 40px rgba(0,0,0,.3); }
        .vsw-pip video { position: absolute; left: -180px; top: -10px; width: 640px; height: 360px; object-fit: cover; }
      </style>
      <div id="root" data-composition-id="vibe-screen-window" data-width="1920" data-height="1080">
        <div class="vsw-bg"></div>
        <div class="vsw-win"><div class="vsw-bar"><i></i><i></i><i></i><span class="vsw-title"></span></div>
          <video id="vsw-screen" src="assets/screen.mp4" data-start="0" data-duration="6.3" data-media-start="0" muted playsinline></video></div>
        <div class="vsw-hl"><span class="vsw-tag"></span></div>
        <div class="vsw-pip"><video id="vsw-pipv" src="assets/talk.mp4" data-start="0" data-duration="6.3" data-media-start="0" muted playsinline></video></div>
        <audio id="vsw-swoosh" src="assets/vibe/sfx/window-swoosh-pop.wav" data-start="0.2" data-duration="1.0" data-volume="0.72"></audio>
        <audio id="vsw-pop" src="assets/vibe/sfx/pop.wav" data-start="0.78" data-duration="0.72" data-volume="0.56"></audio>
        <audio id="vsw-click" src="assets/vibe/sfx/select-click.wav" data-start="1.76" data-duration="0.3" data-volume="0.56"></audio>
      </div>
      <script>
        (() => {
          const v = window.__hyperframes.getVariables();
          const host = document.querySelector('[data-composition-id="vibe-screen-window"]');
          const root = host.querySelector('[data-hf-inner-root]') || host.querySelector('#root') || host; // inner root, so added elements inherit the pack's styles
          const $ = (s) => root.querySelector(s);
          $(".vsw-title").textContent = v.title; $(".vsw-tag").textContent = v.tag;
          $("#vsw-screen").setAttribute("data-media-start", v.mediaStart);
          $("#vsw-pipv").setAttribute("data-media-start", v.pipMediaStart);
          Object.assign($(".vsw-hl").style, { left: v.hlX + "px", top: v.hlY + "px", width: v.hlW + "px", height: v.hlH + "px" });
          if (!v.pip) $(".vsw-pip").style.display = "none";
          const tl = gsap.timeline({ paused: true });
          if (v.enter === "instant") tl.set($(".vsw-bg"), { clipPath: "inset(0% 0 0 0)" }, 0);
          else tl.fromTo($(".vsw-bg"), { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.4, ease: "power3.inOut" }, 0);
          tl
            .fromTo($(".vsw-win"), { y: 700, rotateX: 28, transformPerspective: 1800, scale: 0.85 }, { y: 0, rotateX: 0, scale: 1, duration: 0.65, ease: "power3.out" }, 0.1)
            .fromTo($(".vsw-pip"), { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 0.7)
            .fromTo($(".vsw-hl"), { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2)" }, 1.8)
            .fromTo($(".vsw-tag"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25 }, 2.0)
            .to($(".vsw-hl"), { opacity: 0, duration: 0.2 }, 5.2)
            .to($(".vsw-pip"), { scale: 0, duration: 0.3, ease: "back.in(2)" }, 5.6)
            .to($(".vsw-win"), { y: 120, scale: 0.94, opacity: 0, duration: 0.4, ease: "power3.in" }, 5.85);
          window.__timelines["vibe-screen-window"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

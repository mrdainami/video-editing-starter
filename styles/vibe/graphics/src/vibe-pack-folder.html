<!doctype html>
<html data-composition-variables='[
  {"id":"h1","type":"string","label":"Heading word 1 (heavy)","default":"your"},
  {"id":"h2","type":"string","label":"Heading word 2 (serif)","default":"style"},
  {"id":"h3","type":"string","label":"Heading word 3 (selected)","default":"pack"},
  {"id":"label","type":"string","label":"Folder label","default":"VIBE"},
  {"id":"cards","type":"string","label":"4 cards: icon|title|kind ; separated","default":"Aa|title card|TAKEOVER;{ }|stat pop|WITH ME;▦|block wipe|TRANSITION;♪|sounds|PER ELEMENT"},
  {"id":"bg","type":"color","label":"Background","default":"#111111"}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <!-- vibe · pack-folder · TAKEOVER (big graphic). A big coral folder flies up, opens, fans out 4 cards. Use between block-wipe cover and reveal. Length 4.4s. -->
      <style>/*VIBE_CSS*/</style>
      <style>
        #root { position: absolute; inset: 0; }
        .vpf-bg { position: absolute; inset: 0; }
        .vpf-head { position: absolute; top: 90px; left: 0; right: 0; text-align: center; color: var(--vibe-paper); font-size: 96px; }
        .vpf-head .v-sel { color: var(--vibe-ink); }
        .vpf-fold { position: absolute; left: 610px; top: 430px; width: 700px; height: 500px; }
        .vpf-back { position: absolute; inset: 0; border-radius: 34px; background: #e85457; }
        .vpf-back::before { content: ""; position: absolute; top: -50px; left: 0; width: 270px; height: 80px; border-radius: 26px 26px 0 0; background: #e85457; }
        .vpf-front { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; border-radius: 30px; background: linear-gradient(180deg, #ff8f91, #fc6467); transform-origin: bottom; z-index: 3; box-shadow: 0 -6px 30px rgba(0,0,0,.18); display: grid; place-items: center; }
        .vpf-front span { font: 700 44px "VibePixel"; color: var(--vibe-ink); }
        .vpf-card { position: absolute; left: 230px; top: 60px; width: 240px; height: 300px; border-radius: 18px; background: var(--vibe-paper); z-index: 2; box-shadow: 0 12px 30px rgba(0,0,0,.3); padding: 22px; transform-origin: 50% 100%; }
        .vpf-card .ic { height: 140px; border-radius: 12px; background: #e7e4dd; display: grid; place-items: center; font: 400 54px "VibeHeavy"; color: #c9393c; }
        .vpf-card p { margin-top: 16px; font: 700 26px/1.2 "VibeTight"; color: var(--vibe-ink); }
        .vpf-card small { display: block; margin-top: 8px; font: 700 18px/1.2 "VibePixel"; color: #555; }
      </style>
      <div id="root" data-composition-id="vibe-pack-folder" data-width="1920" data-height="1080">
        <div class="vpf-bg"></div>
        <div class="vpf-head"><span class="v-heavy vpf-h1"></span> <span class="v-serif vpf-h2"></span> <span class="v-sel v-tight"><span class="v-box"></span><span class="v-h l"></span><span class="v-h r"></span><span class="vpf-h3"></span></span></div>
        <div class="vpf-fold"><div class="vpf-back"></div><div class="vpf-front"><span class="vpf-lab"></span></div></div>
        <audio id="vpf-click" src="assets/vibe/sfx/select-click.wav" data-start="0.56" data-duration="0.3" data-volume="0.56"></audio>
        <audio id="vpf-fan" src="assets/vibe/sfx/folder-open-fan.wav" data-start="0.77" data-duration="0.75" data-volume="0.8"></audio>
      </div>
      <script>
        (() => {
          const v = window.__hyperframes.getVariables();
          const host = document.querySelector('[data-composition-id="vibe-pack-folder"]');
          const root = host.querySelector('[data-hf-inner-root]') || host.querySelector('#root') || host; // inner root, so added elements inherit the pack's styles
          const $ = (s) => root.querySelector(s);
          $(".vpf-bg").style.background = v.bg; $(".vpf-h1").textContent = v.h1; $(".vpf-h2").textContent = v.h2; $(".vpf-h3").textContent = v.h3; $(".vpf-lab").textContent = v.label;
          const fold = $(".vpf-fold"); const front = $(".vpf-front");
          v.cards.split(";").slice(0, 4).forEach((c) => {
            const [ic, title, kind] = c.split("|"); const d = document.createElement("div"); d.className = "vpf-card";
            const a = document.createElement("div"); a.className = "ic"; a.textContent = ic;
            const p = document.createElement("p"); p.textContent = title; p.setAttribute("data-layout-allow-overlap", "");
            const s = document.createElement("small"); s.textContent = kind; s.setAttribute("data-layout-allow-overlap", "");
            d.append(a, p, s); fold.insertBefore(d, front);
          });
          const cards = root.querySelectorAll(".vpf-card");
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(root.querySelectorAll(".vpf-head > *"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)", stagger: 0.08 }, 0.25)
            .fromTo($(".v-box"), { scaleX: 0 }, { scaleX: 1, duration: 0.25 }, 0.6)
            .fromTo(fold, { y: 500, rotate: -6 }, { y: 0, rotate: 0, duration: 0.55, ease: "back.out(1.3)" }, 0.2)
            .to(front, { rotateX: 58, transformPerspective: 1400, duration: 0.45, ease: "power2.out" }, 0.9)
            .set(cards, { opacity: 0 }, 0).set(cards, { opacity: 1 }, 1.1)
            .fromTo(cards, { y: 160, rotate: 0, x: 0 }, { y: (i) => [-170, -250, -250, -170][i], x: (i) => [-560, -190, 190, 560][i], rotate: (i) => [-14, -5, 5, 14][i], duration: 0.55, ease: "back.out(1.5)", stagger: 0.09 }, 1.1)
            .to(cards, { y: "-=16", duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 2, stagger: 0.1 }, 1.85);
          window.__timelines["vibe-pack-folder"] = tl;
        })();
      </script>
    </template>
  </body>
</html>

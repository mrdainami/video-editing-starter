<!doctype html>
<html data-composition-variables='[
  {"id":"text","type":"string","label":"Ring text (repeats)","default":"the vibe style"},
  {"id":"cx","type":"number","label":"Head centre x (from subject map)","default":960},
  {"id":"cy","type":"number","label":"Head centre y (from subject map)","default":360},
  {"id":"size","type":"number","label":"Ring size (px)","default":680}
]'>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <!-- vibe · ring-behind · BEHIND ME. Words circle the head. Place UNDER the person cut-out. Pair with vibe-iris (close) to take over. Length 2.1s. -->
      <style>/*VIBE_CSS*/</style>
      <style>
        #root { position: absolute; inset: 0; }
        .vrb-ring { position: absolute; }
        .vrb-ring text { font: 800 54px "VibeTight"; letter-spacing: -0.02em; fill: var(--vibe-ink); }
        .vrb-ring .acc { fill: var(--vibe-coral); }
      </style>
      <div id="root" data-composition-id="vibe-ring-behind" data-width="1920" data-height="1080">
        <svg class="vrb-ring" viewBox="0 0 680 680"><defs><path id="vrb-p" d="M340,340 m-290,0 a290,290 0 1,1 580,0 a290,290 0 1,1 -580,0" /></defs><g class="r"><text><textPath href="#vrb-p" class="vrb-tp"></textPath></text></g></svg>
      </div>
      <script>
        (() => {
          const v = window.__hyperframes.getVariables();
          const host = document.querySelector('[data-composition-id="vibe-ring-behind"]');
          const root = host.querySelector('[data-hf-inner-root]') || host.querySelector('#root') || host; // inner root, so added elements inherit the pack's styles
          const ring = root.querySelector(".vrb-ring"), tp = root.querySelector(".vrb-tp");
          Object.assign(ring.style, { width: v.size + "px", height: v.size + "px", left: v.cx - v.size / 2 + "px", top: v.cy - v.size / 2 + "px" });
          for (let i = 0; i < 3; i++) { tp.append(v.text + " "); const s = document.createElementNS("http://www.w3.org/2000/svg", "tspan"); s.setAttribute("class", "acc"); s.textContent = "✦"; tp.append(s); tp.append(" "); }
          const tl = gsap.timeline({ paused: true });
          tl.set(root.querySelector(".r"), { svgOrigin: "340 340", rotation: 0 }, 0)
            .fromTo(ring, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1)
            .to(root.querySelector(".r"), { rotation: 160, svgOrigin: "340 340", duration: 2.0, ease: "none" }, 0.1);
          window.__timelines["vibe-ring-behind"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
